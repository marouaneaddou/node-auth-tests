name: AUTH API CI/CD

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code 
        uses: actions/checkout@v4

      - name: Run Gitleaks to find leaked secrets
        uses: gitleaks/gitleaks-action@v3
  
      - name: setup node js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
  test:
    runs-on: ubuntu-latest

    needs: 
      - verify

    env:
      JWT_SECRET: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test

    services:
      postgres:
        image: postgres:17
        env: 
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: 
         - "5432:5432"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup node js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run migrate:ci

      - name: Run test
        run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: 
      - test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci 
      - name: Build application
        run: "npm run build"
        

      
      
      