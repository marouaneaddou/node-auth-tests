services:
  app_dev:
    container_name: auth_dev 
    build:
      context: ./
      dockerfile: dockerfile
    env_file:
      - .env
    ports: 
      - "3000:3000"
    depends_on:
      - db
    restart: always
  db_auth_dev: 
    container_name: db_auth_dev 
    image: postgres:17
    env_file:
      - .env
    environment:
        POSTGRES_USER : ${POSTGRES_USER}
        POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
    restart: always

